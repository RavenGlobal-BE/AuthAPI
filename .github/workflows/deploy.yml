name: Go API CI/CD

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ravenglobal-be/authapi 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1. Connect to Tailscale using the Auth Key (The "Golden Ticket")
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.96.2

      # 2. Run the Deployment Script via SSH over the VPN
      - name: Blue/Green Deploy to OVH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_HOST }} # Your 100.x.x.x Tailscale IP
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            # Pull the new image (using the lowercase name)
            docker pull ghcr.io/ravenglobal-be/authapi:${{ github.ref_name }}
            
            # Identify current production container
            CURRENT_CONTAINER=$(docker ps -q --filter "name=my-go-api-")
            
            if [ -z "$CURRENT_CONTAINER" ]; then
              NEW_PORT=3000
              NEW_COLOR="blue"
            else
              CURRENT_PORT=$(docker port $CURRENT_CONTAINER 3000 | cut -d ':' -f 2)
              if [ "$CURRENT_PORT" == "3000" ]; then
                NEW_PORT=3002
                NEW_COLOR="green"
              else
                NEW_PORT=3000
                NEW_COLOR="blue"
              fi
            fi
            
            # Start the new version
            docker run -d --name my-go-api-$NEW_COLOR \
              --env-file /home/debian/go-api/.env \
              -p 127.0.0.1:$NEW_PORT:3000 \
              ghcr.io/ravenglobal-be/authapi:${{ github.ref_name }}
            
            # Health check buffer
            sleep 5
            
            # Hot-swap Nginx upstream
            echo "upstream go_api_backend { server 127.0.0.1:$NEW_PORT; }" | sudo tee /etc/nginx/conf.d/go-api-upstream.conf
            sudo systemctl reload nginx
            
            # Cleanup old version
            if [ -n "$CURRENT_CONTAINER" ]; then
              docker stop $CURRENT_CONTAINER
              docker rm $CURRENT_CONTAINER
            fi