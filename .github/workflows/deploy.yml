name: Go API CI/CD

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ravenglobal-be/authapi 

jobs:
  build-and-push:
    runs-on: blacksmith-2vcpu-ubuntu-2204-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.62.1

      - name: Blue/Green Deploy to OVH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            docker pull ghcr.io/ravenglobal-be/authapi:${{ github.ref_name }}

            CURRENT_CONTAINER=$(docker ps -q --filter "name=my-go-api-")

            if [ -z "$CURRENT_CONTAINER" ]; then
              NEW_PORT=3000
              NEW_COLOR="blue"
            else
              CURRENT_PORT=$(docker port $CURRENT_CONTAINER 3000 | cut -d ':' -f 2)
              if [ "$CURRENT_PORT" == "3000" ]; then
                NEW_PORT=3002
                NEW_COLOR="green"
              else
                NEW_PORT=3000
                NEW_COLOR="blue"
              fi
            fi

            # --- THE ENV FIX: Strip all double quotes from the .env file automatically ---
            sed -i 's/"//g' /home/debian/go-api/.env

            docker ps -aq --filter "name=my-go-api-$NEW_COLOR" | xargs -r docker rm -f

            # --- THE NETWORK FIX: Added --network Main ---
            docker run -d --name my-go-api-$NEW_COLOR \
              --network Main \
              --env-file /home/debian/go-api/.env \
              -p 127.0.0.1:$NEW_PORT:3000 \
              ghcr.io/ravenglobal-be/authapi:${{ github.ref_name }}

            sleep 3
            if ! docker ps -q --filter "name=my-go-api-$NEW_COLOR" --filter "status=running" > /dev/null; then
              echo "CRITICAL: Container crashed immediately. Logs below:"
              docker logs my-go-api-$NEW_COLOR
              exit 1
            fi

            echo "Waiting for /about endpoint to respond on port $NEW_PORT..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:$NEW_PORT/about > /dev/null 2>&1; then
                echo "Container ready after ${i}s"
                READY=true
                break
              fi
              sleep 1
            done

            if [ "$READY" != true ]; then
              echo "ERROR: Container failed healthcheck. Dumping logs and exiting."
              docker logs my-go-api-$NEW_COLOR
              docker stop my-go-api-$NEW_COLOR
              exit 1
            fi

            echo "upstream go_api_backend { server 127.0.0.1:$NEW_PORT; }" | sudo tee /etc/nginx/conf.d/go-api-upstream.conf
            sudo systemctl reload nginx

            if [ -n "$CURRENT_CONTAINER" ]; then
              docker stop $CURRENT_CONTAINER
              docker rm $CURRENT_CONTAINER
            fi